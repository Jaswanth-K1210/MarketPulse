name: MarketPulse-X Pipeline

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes — shared pipeline for all users
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      NEWSDATA_IO_KEY: ${{ secrets.NEWSDATA_IO_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
      MEDIASTACK_API_KEY: ${{ secrets.MEDIASTACK_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      ENVIRONMENT: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ingestion pipeline
        run: python scripts/run_pipeline.py

      - name: Health check
        run: |
          curl -f "${{ secrets.BACKEND_URL }}/api/health" || echo "Health check skipped (backend URL not set)"
